ow something from me? You can ask me a question..","ru":"Приветствую, путник. Хочешь что-то узнать у меня? Можешь задать один вопрос.."},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["46.99px","49px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"ring","ru":"кольцо"},"indent_text":"8px","art":"item_heart_stone.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"ring","style":""}],"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"Hello.. In the distant past, the Great Magician came to the waters of the Lake of Souls. What did it show her?","ru":"Здравствуйте.. В далеком прошлом Великая Волшебница приходила к водам Озера Душ. Что оно ей показало?"},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["46.99px","49px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"ring","ru":"кольцо"},"indent_text":"8px","art":"item_heart_stone.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"ring","style":""}],"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char0"},{"text":{"en":"I can't know what the Lake shows travelers. I'm just the Guardian Spirit of the Lake. I accompany travelers and give instructions. After all, to look into the Lake, your mind must be calm and open. The Great Magician came to the lake to gain power, but she left with nothing - I saw only that. Her face changed as she saw something in the depths.","ru":"Я не могу знать, что показывает Озеро путникам. Я всего лишь Дух-хранитель Озера. Я провожаю путников и даю наставления. Ведь чтобы заглянуть в Озеро, твой разум должен быть спокоен и открыт. Великая Волшебница пришла к озеру, чтобы получить силу, а ушла ни с чем - это я видела. Она изменилась в лице, что-то увидев в глубине. "},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["46.99px","49px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"ring","ru":"кольцо"},"indent_text":"8px","art":"item_heart_stone.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"ring","style":""}],"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"“Hmm, maybe she'll tell you more if she sees the ring?” I thought to myself. I was told you would like this gift.. May I give you this ring?","ru":"“Хм, может она расскажет больше, если увидит кольцо?” - подумал про себя. Мне сказали, вам понравится этот подарок.. Можно вам вручить это кольцо?"},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"},{"go_to":"tue_go","position":["2.50%",0,"13.00%",0],"size":["46.99px","49px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"ring","ru":"кольцо"},"indent_text":"8px","art":"item_heart_stone.png","sound":"take_scroll4","hotspot":["0%","0%"],"art_size":"contain","className":"ring","style":""}],"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char0"},{"text":{"en":"Oh. Yeah.. It's her thing. She was a good kid.. But when she came to me to ask for strength the second time, I let her go to the Lake, but I already saw that she would not get what she wanted. Water can only reflect the truth. A lie cannot sink forever and always comes to the surface.","ru":"Ах. да.. Это ее вещь. Она была хорошим ребенком.. Но когда она пришла ко мне просить силы во второй раз - я подпустила ее к Озеру, но уже видела, что она не получит того, чего желает. Вода может отражать только правду. Ложь не может тонуть вечно и всегда всплывает на поверхность."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"The Great Magician didn't like the truth. She struck the water with her staff and the surface of the Lake darkened. And then she left and cursed the Forest. I don't know anything else. Maybe the Lake will show you more. You can ask me three more questions.","ru":"Великой Волшебнице не понравилась правда. Она ударила посохом по воде и гладь Озера потемнела. А после она ушла и прокляла Лес. Больше я ничего не знаю. Возможно Озеро покажет тебе больше. Ты можешь задать мне еще три вопроса."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu","go_to":"Spirit_questions"}],"background_music":"general music"}],"Spirit_questions":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"Very well, thank you. I would like to learn more about the Lake of Souls and the curse placed on the Great Forest.","ru":"Хорошо, благодарю. Я бы хотел больше узнать об Озере Душ и о проклятии, наложенном на Великий Лес."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char0","choice":[{"go_to":"Spirit_answer_1","position":["24.50%",0,0,"1.00%"],"size":["416px","64px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"       What is the essence of the curse? And is it possible           to get rid of it without sacrificing yourself?","ru":"     В чем суть проклятия? И можно ли от него      избавиться не жертвуя собой?"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]}]}],"background_music":"general music"}],"Spirit_answer_1":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"These are two questions, little wanderer. The problem with the curse is that it doesn't just affect the Forest. Magic all over the world depends on the Great Tree. Therefore, the Tree needs to be awakened from eternal sleep. So much time has passed since the death of the Great Magician that magic has begun to disappear everywhere from the world.","ru":"Это два вопроса, маленький странник. Проблема проклятия в том, что оно влияет не только на Лес. Магия во всем мире зависит от Великого Древа. Поэтому именно его нужно пробудить от вечного сна. После смерти Великой Волшебницы прошло так много времени, что магия стала исчезать повсеместно. "},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"Soon, the flow of magic will become very fragile, and the world will lose its usual power. Magical creatures will disappear into oblivion, artifacts and technologies will stop working, people will live less, face diseases that were previously treated only with magic.. Change is coming if the curse is not lifted.. And even I do not know if these changes are good or bad.","ru":"Скоро поток магии станет совсем хрупким, и мир лишится привычной силы. Волшебные существа растворятся в небытие, артефакты и технологии перестанут работать, люди станут меньше жить, сталкиваться с болезнями, которые раньше лечили только с помощью магии.. Перемены грядут, если не снять проклятие.. И даже я не знаю насколько эти перемены хорошие или плохие."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"The chance to get rid of the curse is very small - Your soul must be pure, strong and full of truth. Only then the Great Tree can be awakened from its eternal sleep. And in order to preserve your soul in the ritual, there is no option at all. Unless you have two souls hidden in your pocket, of course)","ru":"Шанс избавиться от проклятия в принципе очень мал - Твоя душа должна быть чиста, сильна и полна правды. Только тогда Великое Древо может проснуться от вечного сна. А чтобы сохранить свою душу в ритуале - и вовсе нет варианта. Если ты не припрятал две души в кармане, конечно)"},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu","back_to":"Spirit_questions_2"}],"background_music":"general music"}],"Spirit_answer_2":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"If the Great Tree is considered a source of magic all over the world, allowing magic to be learned, giving rituals and knowledge to its students, choosing favorites and gifted talent on them, then the Lake of Souls is the final test for all magicians of the Great Forest. It looks into your soul and sees everything - the past, the present, and even the blurred future. It judges how pure and strong your soul is and how much magic it can withstand.","ru":"Если Великое Древо считается источником магии во всем мире, позволяя обучаться магии, даруя ритуалы и знания своим ученикам, выбирая любимчиков и одаривая их талантом, то Озеро - это финальное испытание для всех магов Великого Леса. Оно смотрит в твою душу и видит все - прошлое, настоящее, и даже размытое будущее. Оно судит насколько твоя душа чиста и сильна и сколько магии она выдержит. "},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"That's how magicians get their power. During their training, they use the magic of the Tree, but to fill their personal vessel, they need to pass the Lake test. You don't need magic, but by looking into it, you can see something important, perhaps fragments of the past that you miss. Of course, if the Lake wants to show you anything.","ru":"Именно так маги получают свою силу. Во время обучения они пользуются магией древа, но чтобы наполнить личный сосуд, им нужно пройти проверку Озера. Тебе ни к чему магия, но заглянув в него, ты сможешь увидеть что-то важное, возможно фрагменты прошлого, которых тебе не хватает. Конечно, если озеро захочет тебе показать хоть что-нибудь. "},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu","back_to":"Spirit_questions_2"}],"background_music":"general music"}],"Spirit_answer_3":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"No one knows. The Lake shows different things to everyone - it helps someone to make decisions, it shows someone a different way. But if you've lost your memory, you'll probably see the past - something you lack to put together. It will look into your soul and decide which truth you deserve.","ru":"Никто не знает. Всем Озеро показывает разное - кому-то помогает принимать решения, кому-то показывает иной путь. Но раз ты потерял память, скорее всего ты увидишь прошлое - что-то, что тебе недостает, чтобы сложить мозаику. Оно заглянет в твою душу и решит, какой правды ты достоин."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu","back_to":"Spirit_questions_2"}],"background_music":"general music"}],"Spirit_check":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"Wait, before you look at your reflection, make your choice. ","ru":"Постой, прежде чем ты взглянешь на свое отражение, сделай свой выбор."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu","choice":[{"go_to":"Spirit_untrust","position":[0,"31.63%",0,"2.83%"],"size":["140px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Dont trust","ru":"Не доверять"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]},{"go_to":"Spirit_trust","position":["30.75%",0,0,"2.84%"],"size":["140px","56px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Trust","ru":"Довериться"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["good_ending","add",1],["soul_light3","set","done"],["light_ending","add",1]]}],"variables":[["hint_troll","add",1]]}],"background_music":"general music"}],"Spirit_questions_2":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"Okay.. Can I ask you a few more questions?","ru":"Хорошо.. Можно задать вам еще несколько вопросов?"},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char0","choice":[{"go_to":"Spirit_check","position":["29.00%",0,0,"3.17%"],"size":["305px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Look at the surface of the Lake","ru":"Всмотреться в поверхность Озера"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[],"show_if":[true,["question1","=","well"],["question2","=","done"]]},{"go_to":"Spirit_answer_2","position":["13.50%",0,0,"3.00%"],"size":["262px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"What does the Lake of Souls do?","ru":"Что делает Озеро Душ?"},"indent_text":"8px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["question1","set","well"]],"show_if":[false,["question1","=","well"],["question2","=","done"]]},{"go_to":"Spirit_answer_3","position":["48.88%",0,0,"3.17%"],"size":["305px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"What will I see in the Lake of Souls?","ru":"Что я увижу в Озере Душ? "},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["question2","set","done"]],"show_if":[false,["question1","=","well"],["question2","=","done"]]}]}],"background_music":"general music"}],"Spirit_trust":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"Even though you don't remember much, you made the right choice. The Lake of Souls and I, its Guardian, cannot lie. So everything I said was the absolute truth.","ru":"Хоть ты и не помнишь почти ничего, но сделал правильный выбор. Озеро Душ и я , его хранительница, не можем врать. Так что все, что я сказала было чистой правдой."},"art":[{"position":[0,"30.00%",0,"23.34%"],"size":["7.37%","12.67%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"0"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"But I see that you need the last soul-light. Hold it. Now it's up to you to decide what to do with them. Now go, look carefully into the dark waters of the Lake and you will see the truth.","ru":"Но я вижу, что тебе не хватает последнего огонька души. Держи. Теперь только тебе решать, что с ними делать. А теперь ступай, внимательно всмотрись в темные воды Озера и ты узреешь истину."},"art":[{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"choice":[{"go_to":"Past_choice","position":["29.00%",0,0,"2.17%"],"size":["305px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Look at the surface of the Lake","ru":"Всмотреться в поверхность Озера"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]}],"name":"char3_copu_copu_copu_copu","sound":"magic appearance"}],"background_music":"general music"}],"Spirit_untrust":[{"background_image":"bg_lake_with_spirit.png","dialogs":[{"text":{"en":"All right, go ahead, Little Spirit. I think I've already seen the future of our Forest. You haven't collected enough soul lights, you haven't found the truth in this Forest, and you haven't been able to sort out your past.","ru":"Хорошо, ступай, Маленький Дух. Кажется, я уже видела будущее нашего Леса. Ты не собрал достаточное количество огоньков душ, не нашел правды в этом Лесу и не смог разобраться в своем прошлом."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char3_copu_copu_copu_copu"},{"text":{"en":"Over the centuries, magic will disappear from this world altogether. Iron birds will fly across the sky, and huge iron worms will roar across the ground. But the people.. they will live. It seems a new world is coming. Now go, look carefully into the dark waters of the Lake and you will see the truth.","ru":"Через века магия из этого мира исчезнет совсем. По небу будут летать железные птицы, с грохотом будут мчаться по земле огромные железные черви. Но люди.. будут жить. Кажется, новый мир грядет. А теперь ступай, внимательно всмотрись в темные воды Озера и ты узреешь истину."},"art":[{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"choice":[{"go_to":"Past_choice","position":["29.00%",0,0,"2.17%"],"size":["305px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Look at the surface of the Lake","ru":"Всмотреться в поверхность Озера"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]}],"name":"char3_copu_copu_copu_copu"}],"background_music":"general music"}],"Mirror_in_the_surface_secret":[{"background_image":"bg_mirror.png","dialogs":[{"text":{"en":"I think they say that if you stare into the abyss for a long time, the abyss will start to stare at you.. Gradually, the reflection began to blur. twist, distort, and turn into strange images.. This.. the past. The past of Great Magician.","ru":"Кажется, говорят, если долго вглядываться в бездну, бездна начнет вглядываться в тебя.. Постепенно отражение стало размываться. закручиваться, искажаться и превращаться в странные образы.. Это.. прошлое. Прошлое Великой Волшебницы"},"art":[{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"sound":"lake_sound"}],"background_music":"general music"},{"dialogs":[{"text":{"en":"In the distant past, the Great Magician came to the waters of the Lake of Souls. She was deceived by someone she served faithfully and betrayed by those she considered family in the Great Forest. Therefore, she came to the Lake full of Darkness in a cracked soul. But the reflection still showed her the secrets of the past. She saw that the King had deliberately started a war and intended to destroy the Forest until he drained all his strength from it to win the war.","ru":"В далеком прошлом Волшебница подошла к водам Озера Душ. Она была обманута тем, кому служила верой и правдой и предана теми, кого считала семьей в Великом лесу. Потому пришла она к Озеру полная Тьмы в надтреснутой душе. Но отражение все же показало ей тайны прошлого. Она увидела, что Король специально развязал войну и намерен погубить Лес, пока не вытянет из него все силы в стремлении вырвать победу."},"art":[{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"Then she decided to seal the Great Forest so that the King could no longer deceive anyone and send for power. She wanted to put up a magical barrier around the Forest that would stand for 20 years. But because of the wrong ritual that Moon Face gave her, the spell began to suck the life out of the Forest and its inhabitants to support this barrier.","ru":"Тогда она решилась запечатать Великий Лес, чтобы Король больше никого не смог обмануть и подослать за силой. Она хотела поставить магический барьер вокруг Леса, который бы стоял 20 лет. Но из-за неправильного ритуала, который ей дал Луноликий, заклинание начало высасывать жизнь из Леса и его обитателей для поддержки этого барьера."},"art":[{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"The price for this ritual was supposed to be her magical power, but due to the fact that the Keeper of Shadows deceived her and shared the Darkness, the spell turned into an eternal curse, and the Darkness strengthened it. So the soul of the Great Sorceress went to Moon Face, and her magic to Keeper of Shadows.","ru":"Ценой за этот ритуал должна была стать ее магическая сила, но из-за того, что Хранитель Теней обманул ее и поделился Тьмой, заклинание обратилось в бессрочное проклятье, а Тьма усилила это его. Так душа Великой Волшебницы отошла Луноликому, а ее магия - Хранителю Теней."},"art":[{"position":["36.50%",0,"7.17%",0],"size":["33.12%","33.33%"],"url":"2 - 3 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"The Great Magician realized that something had gone wrong, but she was no longer able to change anything. And before she was scattered into the shadows, she managed to throw off her mask. After all, she had left a small flaw in the ritual.. The one that should be everyone's salvation.","ru":"Великая Волшебница поняла, что что-то пошло не так, но уже не в силах была что-то изменить. И прежде чем ее развеяло в тенях, она успела сбросить с себя маску. Ведь она оставила лазейку в ритуале.. Ту самую, которая должна стать всеобщим спасением. "},"art":[{"position":["36.50%",0,"7.17%",0],"size":["33.12%","33.33%"],"url":"2 - 3 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"1.25%","7.00%",0],"size":["33%","33%"],"url":"2 - 4 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_l soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]}],"background_color":"#141921","background_music":"general music"},{"background_image":"bg_mirror_secret.png","dialogs":[{"text":{"en":"The mask slowly surfaced from the bottom and appeared on the surface of the Lake. Time didn't seem to have touched it  at all. That's what was really happened that ill-fated night. That's who I've been all this time. Still, sometimes knowledge is a heavy burden.\n\n","ru":"Маска медленно всплыла со дна и появилась на поверхности Озера. Время, казалось, совсем не тронуло ее. Вот что произошло на самом деле в ту злополучную ночь. Вот кем я был все это время. Все-таки иногда знание - это тяжкое бремя.\n\n"},"art":[{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"choice":[{"go_to":"tue_go","position":["33.63%",0,0,"1.33%"],"size":["250px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Take the mask from the surface","ru":"Взять маску с поверхности"},"indent_text":"8px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["light_ending","add",10]]}]}],"background_music":"general music"},{"background_image":"bg_lake_end_secret.png","dialogs":[{"text":{"en":"It turns out that I was the reason for the curse of the Forest. I am a part of the Great Magician's huge soul in the past. And only I can fix everything and lift the curse.… That's why I was reborn on Mossy Hummocks, that's what I've been going for all this time.","ru":"Оказывается, что это я был причиной проклятия Леса. Я - часть огромной души Великой Волшебницы в прошлом. И только мне под силу исправить все и снять проклятие… Вот для чего я возродился на Мшистых кочках, вот к чему шел все это время."},"art":[{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"name":"char0","go_to":"Great_choice"}],"background_music":"general music"}],"Mirror_good":[{"background_image":"bg_mirror.png","dialogs":[{"text":{"en":"I think they say that if you stare into the abyss for a long time, the abyss will start to stare at you.. Gradually, the reflection began to blur. twist, distort, and turn into strange images.. This.. the past. But wait... this is my story","ru":"Кажется, говорят, если долго вглядываться в бездну, бездна начнет вглядываться в тебя.. Постепенно отражение стало размываться. закручиваться, искажаться и превращаться в странные образы.. Это.. прошлое. Но подождите.. это мое прошлое"},"art":[{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}],"sound":"lake_sound"}],"background_music":"general music"},{"dialogs":[{"text":{"en":"In the distant past, the Great Magician came to the waters of the Lake of Souls. She was deceived by someone she served faithfully and betrayed by those she considered family in the Great Forest. Therefore, she came to the Lake full of Darkness in a cracked soul. But the reflection still showed her the secrets of the past. She saw that the King had deliberately started a war and intended to destroy the Forest until he drained all his strength from it to win the war.","ru":"В далеком прошлом Волшебница подошла к водам Озера Душ. Она была обманута тем, кому служила верой и правдой и предана теми, кого считала семьей в Великом лесу. Потому пришла она к Озеру полная Тьмы в надтреснутой душе. Но отражение все же показало ей тайны прошлого. Она увидела, что Король специально развязал войну и намерен погубить Лес, пока не вытянет из него все силы в стремлении вырвать победу."},"art":[{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"Then she decided to seal the Great Forest so that it would not suffer from the actions of the King, and magic would not be used with malicious intent. She wanted to put up a magical barrier around the Forest that would stand for 20 years. But because of the wrong ritual that Moon Face gave her, the spell began to suck the life out of the Forest and its inhabitants to support this barrier.","ru":"Тогда она решилась запечатать Великий Лес, чтобы он не пострадал от действий Короля, а магия не использовалась со злым умыслом. Она хотела поставить магический барьер вокруг Леса, который бы стоял 20 лет. Но из-за неправильного ритуала, который ей дал Луноликий, заклинание начало высасывать жизнь из Леса и его обитателей для поддержки этого барьера."},"art":[{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"The price for this ritual was supposed to be her magical power, but due to the fact that the Keeper of Shadows deceived her and shared the Darkness, the spell turned into an eternal curse, and the Darkness strengthened it. So the soul of the Great Sorceress went to Moon Face, and her magic to Keeper of Shadows.\n","ru":"Ценой за этот ритуал должна была стать ее магическая сила, но из-за того, что Хранитель Теней обманул ее и поделился Тьмой, заклинание обратилось в бессрочное проклятье, а Тьма усилила это его. Так душа Великой Волшебницы отошла Луноликому, а ее магия - Хранителю Теней."},"art":[{"position":["36.50%",0,"7.17%",0],"size":["33.12%","33.33%"],"url":"2 - 3 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"size":["43%","43.5%"],"url":"2-1 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["19.63%",0,"2.33%",0],"size":["4.12%","7.33%"],"url":"soul_3.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"1","show_if":[true,["soul_light3","=","done"]]},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":"","show_if":[true,["soul_light2","=","true"]]}]},{"text":{"en":"And they tried to trick you as well, Little Spirit. The Keeper of Shadows offered you Darkness, and the Moon Face offered you to give him your soul - he wanted to take it for himself in order to spare himself more years of life. Remember, did you trust the traitors?","ru":"И тебя они попытались обмануть, Маленький Дух. Хранитель Теней предлагал тебе Тьму, а Луноликий предлагал тебе отдать душу - он хотел забрать ее себе, чтобы выпрясти себе больше лет жизни. Вспомни, доверился ли ты предателям?"},"art":[{"position":["36.50%",0,"7.17%",0],"size":["33.12%","33.33%"],"url":"2 - 3 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.88%",0,"35.83%",0],"size":["57.38%","44.33%"],"url":"2 - 2 secret mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"1.25%","7.00%",0],"size":["33%","33%"],"url":"2-4 usual mirror.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.88%",0,"7.33%",0],"  shook itself and began to shed the shackles of a long sleep. Gradually, magic began to flow through all the fading leaves with a light stream, and to fill all magical creatures. The Forest was coming back to life and recovering. The curse was gone.","ru":"Как только вы вставили в Великое Древо три кристалла душ, Забытый Лес встряхнулся и начал сбрасывать оковы долгого сна. Постепенно магия легким потоком стала пронизывать все увядающие листики, и наполнять магией всех волшебных существ. Лес возвращался к жизни и восстанавливался. Проклятье спало."},"art":[{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}],"sound":"button_click","sound_stop":"","video":{"url":"","fit":"cover"}},{"text":{"en":"But the price for lifting the curse is high, because the Great Tree needs your soul to awaken. The Little Spirit's hands begin to tremble and crumble into black leaves, dissolving into clumps of ash in the air.","ru":"Но цена за снятие проклятия высока - ведь Великому Древу для пробуждения нужна и ваша душа. Руки Маленького духа начинают дрожать и рассыпаться черными листьями, растворяясь в воздухе комьями пепла."},"art":[{"position":["39.38%",0,"3.83%",0],"size":["33%","31.83%"],"url":"good_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"So the Little Spirit ended his adventure, disappearing into the gloomy shadows of the Magical Forest. He sacrificed his small but bright soul to save everyone else, and a small mossy hummock can still be found in the place where he stood.","ru":"Так Маленький Дух закончил свое приключение, растворившись в сумрачных тенях Волшебного Леса. Он пожертвовал своей маленькой, но яркой душой ради спасения всех остальных, и на месте, где он стоял, и по сей день можно найти маленькую мшистую кочку. "},"art":[{"position":[0,"3.13%","4.00%",0],"size":["32.25%","38.5%"],"url":"good_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.83%",0],"size":["33%","31.83%"],"url":"good_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"And magical creatures still live in the Magical Forest to this day, telling about a brave Little Spirit who was able to lift the great curse of the Forgotten Forest. Even the Snail-Cat was reborn from the sparks of magic and reunited with his lost family - the Tree protected them as best it could all this time.","ru":"А волшебные существа и по сей день живут в Волшебном Лесу, рассказывая о смелом Маленьком Духе которому оказалось под силу снять великое проклятье Забытого Леса. Даже котенок-улитка возродился из искр магии и воссоединился со своим потерянным семейством - Древо оберегало их как могло все это время."},"art":[{"position":["4.00%",0,"32.67%",0],"size":["59.13%","41.83%"],"url":"good_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"3.13%","4.00%",0],"size":["32.25%","38.5%"],"url":"good_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.83%",0],"size":["33%","31.83%"],"url":"good_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"And the soul of the Little Spirit, peaceful and pleased with what he saw, but tired of long wanderings, finally slipped into the waters of the Lake, and merged with other lights. So it completed its long adventure, fulfilled its destiny, and finally found the long-awaited peace.","ru":"А душа Маленького Духа, умиротворенная и довольная увиденным, но уставшая от долгих странствий, наконец-то скользнула в воды Озера, и слилась с другими огоньками. Так она завершила свое долгое приключение, исполнила предназначение и наконец обрела долгожданный покой."},"art":[{"position":["48.50%",0,"33.33%",0],"size":["46.88%","40.83%"],"url":"good_ending_5.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"32.67%",0],"size":["59.13%","41.83%"],"url":"good_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"3.13%","4.00%",0],"size":["32.25%","38.5%"],"url":"good_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.83%",0],"size":["33%","31.83%"],"url":"good_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"art":[{"position":["48.50%",0,"33.33%",0],"size":["46.88%","40.83%"],"url":"good_ending_5.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"32.67%",0],"size":["59.13%","41.83%"],"url":"good_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"3.13%","4.00%",0],"size":["32.25%","38.5%"],"url":"good_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.83%",0],"size":["33%","31.83%"],"url":"good_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["4.00%",0,"1.00%",0],"size":["43.87%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["46.75%",0,0,"3.67%"],"size":["55px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"1/3","ru":"1/3"},"indent_text":"8px","style":"","art":{"en":"item_slot.png","ru":"button_basic.png"},"sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","size_text":"20px","font_family":"times new roman","className":"","variables":[]},{"go_to":"The_End","position":["40.88%",0,0,"10.34%"],"size":["150px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"The End","ru":"Конец"},"indent_text":"8px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]}],"controll":"hidden"}],"background_color":"#141921","background_music":"general music"}],"Bad_ending":[{"dialogs":[{"text":{"en":"The forest began to fade rapidly. Darkness was gathering in the air around, the roots were shriveling, the leaves were shrinking in agony, and the ground was slowly rotting right under our feet. The last sparks of magic dissolved into the Darkness and faded. The Great Tree dries up and cracks, the Lake becomes just a swamp covered with black, viscous mud. The magical creatures disappeared one by one, crumbling into cold ashes.","ru":"Лес начал стремительно угасать. Тьма сгущалась в пространстве вокруг, корни скукоживались, листья сжимались в агонии, а земля медленно гнила прямо под ногами. Последние искры магии растворялись во Тьме и угасали. Великое Древо засыхает и трескается, Озеро становится просто болотом, затянутым черной, вязкой тиной. Волшебные существа исчезали одно за другим, рассыпаясь холодным пеплом."},"art":[{"position":["3.38%",0,"3.00%",0],"size":["41%","37.67%"],"url":"bad_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"The Little Spirit remains standing all alone on the black ashes, where the heart of the Forest was beating not long ago. Gradually, the ash in the air settled to the ground, covering the entire area with an even layer for miles around. This is how a lifeless Black Wasteland appeared on the world map - all that remained of the once Great Magical Forest.","ru":"Маленький Дух остается совершенно один стоять на черном пепле, там, где еще недавно билось сердце Леса. Постепенно пепел в воздухе осел на землю, покрыв ровным слоем все пространство на многие мили вокруг. Так на карте мира появилась Черная безжизненная пустошь - все, что осталось от некогда Великого Волшебного Леса."},"art":[{"position":["45.25%",0,"3.17%",0],"size":["51.62%","43.67%"],"url":"bad_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.38%",0,"3.00%",0],"size":["41%","37.67%"],"url":"bad_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"Unable to forgive, not daring to understand and find out the truth to the end, the Little Spirit slowly wandered out of the Wasteland, raking black ashes with his little feet. He set out to wander further in the hope of one day finding a new purpose—if one still exists.","ru":"Не сумев простить, не решившись понять и выяснить правду до конца, Маленький Дух медленно побрел на выход из Пустоши, загребая маленькими ножками черный пепел. Он отправился странствовать дальше в надежде однажды найти новую цель — если таковая ещё существует."},"art":[{"position":["3.50%",0,"33.33%",0],"size":["49%","42.5%"],"url":"bad_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["45.25%",0,"3.17%",0],"size":["51.62%","43.67%"],"url":"bad_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.38%",0,"3.00%",0],"size":["41%","37.67%"],"url":"bad_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"And the world began to live in a new way. Without magic, the Kingdoms had to unite, share technology, healing secrets, and more. People learned anew how to live without magic, extract valuable resources from the earth, build roads, factories and machinery. And somewhere among the smoke of these factories, a Little Spirit still wandering, remembering the clean air of the Great Forest, the magic ringing in the air and mourning all those whom he led to ruin.","ru":"А мир начал жить по новому. Без магии, Королевствам пришлось объединиться, делиться технологиями, секретами врачевания и многим другим. Люди заново учились жить без магии, добывать ценные ресурсы из земли, строить дороги, заводы и машины. И где-то среди дыма этих заводов до сих пор бродит Маленький Дух, вспоминая о чистом воздухе Великого Леса, волшебстве, звенящем в воздухе и оплакивая всех тех, кого он обрек на гибель."},"art":[{"position":["42.50%",0,"36.33%",0],"size":["54%","39.17%"],"url":"bad_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.50%",0,"33.33%",0],"size":["49%","42.5%"],"url":"bad_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["45.25%",0,"3.17%",0],"size":["51.62%","43.67%"],"url":"bad_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.38%",0,"3.00%",0],"size":["41%","37.67%"],"url":"bad_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"art":[{"position":["42.50%",0,"36.33%",0],"size":["54%","39.17%"],"url":"bad_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.50%",0,"33.33%",0],"size":["49%","42.5%"],"url":"bad_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["45.25%",0,"3.17%",0],"size":["51.62%","43.67%"],"url":"bad_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.38%",0,"3.00%",0],"size":["41%","37.67%"],"url":"bad_ending_1.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["46.75%",0,0,"3.67%"],"size":["55px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"2/3","ru":"2/3"},"indent_text":"8px","style":"","art":{"en":"item_slot.png","ru":"button_basic.png"},"sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","size_text":"20px","font_family":"times new roman","className":"","variables":[]},{"go_to":"The_End","position":["40.88%",0,0,"10.34%"],"size":["150px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"The End","ru":"Конец"},"indent_text":"8px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]}],"controll":"hidden"}],"background_color":"#141921","background_music":"general music"}],"Secret_ending":[{"dialogs":[{"text":{"en":"As soon as you inserted three soul-lights and the Mask into the Great Tree, the Forgotten Forest shook itself and began to shed the shackles of a long sleep. Gradually, magic began to flow through all the fading leaves with a light stream, and to fill all magical creatures with magic. The forest was coming back to life and recovering. The curse was gone.","ru":"Как только вы вставили в Великое Древо три кристалла душ и маску, Забытый Лес встряхнулся и начал сбрасывать оковы долгого сна. Постепенно магия легким потоком стала пронизывать все увядающие листики, и наполнять магией всех волшебных существ. Лес возвращался к жизни и восстанавливался. Проклятье спало."},"art":[{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"“This is probably the end of my journey. When I saved the Tree, I knew what I was doing. It's supposed to take my soul.” - the Little Spirit thought. But seconds, minutes passed.. and nothing happened. The Little Spirit remained standing in its place. Then the Spirit of the Lake, who was nearby, whispered: “The Great Tree did not take your soul, because you already gave a part of yourself - a small part of your previously great soul was enclosed in the mask.”","ru":"“Наверное, это конец моего пути. Спасая Древо, я знал на что шел. Оно должно забрать мою душу.” - подумал Маленький Дух Но шли секунды, минуты.. и ничего не происходило. Маленький Дух остался стоять на своем месте. Тогда Дух Озера, что был поблизости, шепнул: “Великое Древо не забрало твою душу, потому что ты и так отдал часть себя - в маске была заключена маленькая частица твоей прежде великой души”"},"art":[{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"So the Little Spirit survived, but knowing the truth about his past and realizing how much suffering he had caused, he could no longer stay in the Forest. The weight of guilt and responsibility weighed on his heart, and he slowly, bowing his head, wandered away along the path, leaving behind the whisper of trees and familiar shadows.","ru":"Так Маленький Дух выжил, но, зная правду о своём прошлом и осознавая, скольким страданиям он стал причиной, он не смог больше оставаться в Лесу. Тяжесть вины и ответственности легла на его сердце, и он медленно, склонив голову, побрел по тропинке прочь, оставляя за спиной шёпот деревьев и знакомые тени."},"art":[{"position":[0,"16.75%","3.67%",0],"size":["17.88%","32.17%"],"url":"secret_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"Hey! Little Spirit! Wait a minute!","ru":"Эй! Маленький Дух! Постой!"},"art":[{"position":[0,"-4.00%","3.67%",0],"size":["28.75%","27.67%"],"url":"secret_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"16.75%","3.67%",0],"size":["17.88%","32.17%"],"url":"secret_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"The creatures of the Magical Forest surrounded him. There was a Witch without a Heart, and a Sock Troll, and an Old Sage, and even the Spirit of the Lake flew after him. There was a patter of small paws and a family of Snail-Kittens ran out onto the path - The Tree has been carefully preserving their souls all this time. “Our Forest and friends have been reborn thanks to you, but do you want to leave? We know the truth, the Lake has shown us everything. We don't blame you, let the past be in the past, and you stay with us! This is your Home.”","ru":"Существа Волшебного Леса окружили его. Здесь была и Ведьма без Сердца, и Носочный Тролль, и Старый Мудрец, и даже Дух Озера прилетел за ним. Послышался топот маленьких лапок и на тропинку выбежало семейство Котят-улиток - Древо все это время бережно хранило их души. “Наш Лес и друзья возродились благодаря тебе, а ты хочешь уйти? Мы знаем правду, Озеро показало все и нам. Мы не виним тебя, пусть прошлое останется в прошлом, а ты оставайся с нами! Здесь твой Дом.”"},"art":[{"position":["1.63%",0,"34.67%",0],"size":["39.5%","40%"],"url":"secret_ending_5.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"-4.00%","3.67%",0],"size":["28.75%","27.67%"],"url":"secret_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"16.75%","3.67%",0],"size":["17.88%","32.17%"],"url":"secret_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"text":{"en":"So the Little Spirit realized that in the reborn Forest he had found his forgotten family again, who had been waiting for his return for many years. Now he was not alone, and he knew that he would always be supported, and would never allow the deception to happen again. So he found a new purpose and became the Little Guardian of the Magical Forest - the one who controls the magical barrier around the Forest, preserves peace, memory and truth. And as long as the Forest breathes and whispers, his heart will beat with him.","ru":"Так Маленький Дух понял, что в возрожденном Лесу он вновь обрел свою забытую семью, которая ждала его возвращения долгие годы. Теперь он был не один и знал, что его всегда поддержат, и больше никогда не позволят обману повториться. Так он обрел новое предназначение и стал Маленьким Хранителем Волшебного Леса - тем, кто управляет магическим барьером вокруг Леса, хранит мир, память и правду. И пока Лес дышит и шепчет, его сердце будет биться вместе с ним."},"art":[{"position":["32.50%",0,"29.67%",0],"size":["66.62%","44.67%"],"url":"secret_ending_6.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.63%",0,"34.67%",0],"size":["39.5%","40%"],"url":"secret_ending_5.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"-4.00%","3.67%",0],"size":["28.75%","27.67%"],"url":"secret_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"16.75%","3.67%",0],"size":["17.88%","32.17%"],"url":"secret_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}]},{"art":[{"position":["32.50%",0,"29.67%",0],"size":["66.62%","44.67%"],"url":"secret_ending_6.png","fit":"contain","hotspot":["0%","0%"]},{"position":["1.63%",0,"34.67%",0],"size":["39.5%","40%"],"url":"secret_ending_5.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"-4.00%","3.67%",0],"size":["28.75%","27.67%"],"url":"secret_ending_4.png","fit":"contain","hotspot":["0%","0%"]},{"position":[0,"16.75%","3.67%",0],"size":["17.88%","32.17%"],"url":"secret_ending_3.png","fit":"contain","hotspot":["0%","0%"]},{"position":["39.38%",0,"3.50%",0],"size":["33%","31.83%"],"url":"secret_ending_2.png","fit":"contain","hotspot":["0%","0%"]},{"position":["3.75%",0,"0.67%",0],"size":["44.12%","40.5%"],"url":"secret_good_ending_1.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["46.75%",0,0,"3.67%"],"size":["55px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"
