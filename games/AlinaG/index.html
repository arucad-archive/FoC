.hint{
  pointer-events: none; /* делает элемент полностью некликабельным */
}

.coin {
  position: relative;
  cursor: default;
}

.ring,
.eye,
.obsidian,
.sword,
.coin,
.light,
.shell,
.mask,
.tear {
  position: relative;
}

/* базовый стиль тултипа */
.ring::after,
.eye::after,
.obsidian::after,
.sword::after,
.coin::after,
.light::after,
.shell::after,
.mask::after,
.tear::after {
  position: absolute;
  left: 220%;
  top: 35%;
  transform: translateX(-50%);
  background: #f3e6c8;
  border: 2px solid #6b4b2a;
  color: #4a2f16;
  padding: 5px 6px;
  border-radius: 6px;
  font-size: 12px;
  font-family: georgia;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 999;
}

/* появление */
.ring:hover::after,
.eye:hover::after,
.obsidian:hover::after,
.sword:hover::after,
.coin:hover::after,
.light:hover::after,
.shell:hover::after,
.mask:hover::after,
.tear:hover::after {
  opacity: 1;
  transform: translateX(-50%) translateY(-5px);
}

.coin::after {
  content: "Golden coin";
}

.light::after {
  content: "Amulet with light";
}

.shell::after {
  content: "Broken shell";
}

.tear::after {
  content: "Crystal tear";
}

.eye::after {
  content: "Eye of darkness";
}

.obsidian::after {
  content: "Obsidian tear";
}

.sword::after {
  content: "The sword of peace";
}

.ring::after {
  content: "Old Magic Storage Ring";
}

.mask::after {
  content: "The Mask of Great Magician";
}

age":"main_menu_bg.png","background_music":"general music"}],"Gloomy_forest":[{"dialogs":[{"text":{"en":"We see broken black branches, trunks overgrown with moss, and the keepers of the pond, sleeping and cracked - gradually everything magical in this Forest will die if the curse is not lifted.","ru":"Мы видим обломанные черные ветки, стволы, поросшие мхом и хранителей пруда, спящих и потрескавшихся - постепенно все магическое в этом Лесу умрет, если не снять проклятие."},"js":"","html":"","art":[{"position":["-38.75%",0,0,"-32.00%"],"size":["43.62%","77.83%"],"url":"main_character_back.png","fit":"contain","hotspot":["0%","0%"],"move":"1","speed":"ease-out"}]},{"text":{"en":"The deeper into the forest I go, the more clearly the traces of wilting are visible.. So my memories are true - the Forest was once cursed.","ru":"Чем глубже в лес я ухожу тем отчетливее видны следы увядания.. Так значит мои воспоминания правдивы - Лес когда-то был проклят."},"js":"","html":"","name":"char0","art":[{"position":["-10.25%",0,"25.00%",0],"size":["55.77%","95.47%"],"url":"main_character_back.png","fit":"contain","hotspot":["0%","0%"],"move":"0.6","speed":"ease-out"}],"choice":[{"go_to":"Troll_path","position":["36.50%",0,0,"2.17%"],"size":["180px","4px"],"color":"rgba(242,242,242,0)","color_text":"#282f67","text":{"en":"Continue wandering","ru":"Продолжить странствие"},"indent_text":"3%","art":"button_basic.png","sound":"button_click","hotspot":["0","0"],"size_text":"16px","art_size":"100% 100%","font_family":"gorgia"}]}],"background_color":"#141921","background_image":"bg_gloomy_forest.png","background_music":"general music"}],"Troll_path":[{"dialogs":[{"text":{"en":"So a Little Spirit comes across a narrow path, completely blocked by a cauldron and an enthusiastic Troll. He grumbles, taps his belly, and occasionally stirs the stew in the pot with a stick.","ru":"Так Маленький Дух набредает на узкую тропинку, полностью перегороженную котлом и увлеченным Троллем. Он ворчит, постукивает себя по пузу и изредка перемешивает палкой варево в котле."},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Come on, come on, what's up? Do you want some soup? He'll be ready very soon, and I don't have the most important sock... But okay, what are you doing here? Why couldn't you sit in the swamps?","ru":"Проходи, проходи, что встал? Хочешь супчика? Он совсем скоро приготовится, а у меня нет самого важного носка... Но ладно, ты то что пришел? Чего в болотах не сиделось?"},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Hi.. I only woke up recently, I don't remember anything at all.. What's going on here? And… soup from socks? What sock do you miss?","ru":"Привет.. Я очнулся только недавно, совсем не помню ничего.. Что здесь происходит?"},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char0","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Nothing at all? The forest is cursed, as you can see for yourself, magic is leaving, and with it the life of all magical creatures. You'll have to find out for yourself what happened.","ru":"Прям совсем ничего? Лес проклят, ты и сам это видишь, магия уходит, а вместе с ней и жизнь всех магических существ. Ты должен будешь сам узнать что произошло."},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Socks.. Everyone comes here for truth, meaning, destiny, power.… I just need a yellow sock. And no one gives! You see, only yellow socks have an indescribable sweet sourness. Without a yellow sock, soup is not soup, but just like.. brew. Eh...","ru":"Носки… Все сюда приходят за истиной, смыслом, судьбой, силой… А мне просто нужен жёлтый носок. И никто не дает! Понимаешь, только у желтых носков есть непередаваемая сладкая кислинка. Без желтого носка и суп не суп, а так.. варево. Эх..."},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Just, little, don't bring me the blue ones - they're insidious and sharp, the red ones makes your mouth pucker, and I have enough green ones in my soup as it is. If you find it, please bring it? I want to have a delicious dinner","ru":"Только, малыш, не тащи мне синих - они коварны и остры, красные - вяжут рот, а зеленых у меня в супе и так достаточно. Если найдешь - принеси пожалуйста? Хочу вкусно поужинать"},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"Well... So what about me? Where can I find the answers?","ru":"Хорошо.. так что насчет меня? Где я могу найти ответы?"},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char0","choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}]},{"text":{"en":"You can only get answers by learning the stories of the Forest's inhabitants. They will tell you about the past if you bring them valuable gifts. If you don't guess with the gift, they won't tell you anything valuable, so choose carefully. But you can find hints in the forest.","ru":"Ты сможешь получить ответы, только узнав истории обитателей Леса. Они расскажут тебе о прошлом, если принесешь им ценные дары. Если не угадаешь с даром - тебе не расскажут ничего ценного, так что выбирай внимательно. Но ты можешь найти подсказки в лесу."},"js":"","html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"}],"name":"char1"},{"text":{"en":"First, go to the rotten house at the edge of the forest. You can find a lot of interesting things there. To find something, look carefully at the objects. If a white outline appears around them, you can take this object, look, there's a scroll lying around. Pick it up!","ru":"Сначала иди к трухлявому дому на опушке. Там можешь найти много интересного. Чтобы найти что-то - внимательно вглядывайся в предметы. Если вокруг них появляется белый контур - ты можешь взять этот предмет, вот, смотри, тут валяется свиток - подбери его."},"html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"choice":[{"go_to":"tue_no","position":["16.25%",0,0,"26.67%"],"size":["44.24px","47.19px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll","ru":"свиток тролля"},"indent_text":"12px","art":"item_scroll_troll.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain"},{"go_to":"Completed","position":["16.13%",0,0,"27.61%"],"size":["52.33px","48.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll troll hover","ru":"свиток тролля контур"},"indent_text":"8px","art":"item_scroll_troll_hover.png","sound":"take_scroll4","hotspot":["0%","0%"],"art_size":"contain","className":"ornament","variables":[["hint_var","set","done"]]}],"name":"char1"}],"background_color":"#141921","background_image":"bg_troll_path.png","background_music":"general music"}],"Hints_book":[{"terrain_map":{"color":"#fff","objects":[{"go_to":"tue_no","position":[429,207],"size":[275,293],"art":"item_hint.png","fit":"100% 100%","name":{"en":"The Diary of the Great Magician - part 2                      The king’s daughter and a foreign prince loved each other, but the king used their love to begin a war. He poisoned his own daughter and blamed the prince, turning her death into an excuse for invasion. To secure victory, he sought the ancient power of the Forest and sent the Great Sorceress to claim it.  The truth was revealed by the Lake. The Sorceress saw the king’s greed, the dishonor of the war, and the destruction this power would bring. She refused to serve his cruelty, but her family was taken hostage, leaving her no escape.  To stop the war and protect the Forest, she chose a forbidden ritual. With knowledge from the Moon-Faced One and strength from the Shadow Keeper, she sealed the Great Forest behind a barrier for twenty years — until the king’s death and the end of the war. The cost was her magic and her freedom, but she believed this sacrifice was the only way to prevent greater bloodshed.","ru":"Дневник Великой Волшебницы - часть 2                Дочь короля и чужеземный принц любили друг друга, но король использовал их чувства ради войны. Он отравил собственную дочь и обвинил принца, сделав её смерть поводом для вторжения. Чтобы победить, ему была нужна сила Леса, и он отправил Великую Волшебницу за этой магией.  Озеро открыло ей правду. Она увидела алчность Короля, бесчестье войны и гибель, которую принесла бы эта сила. Волшебница отказалась служить злу, но её семья стала заложниками, лишив её выбора.  Чтобы остановить войну и спасти Лес, она решилась на запретный ритуал. Получив знание и силу от тёмных сущностей, она запечатала Великий Лес барьером на двадцать лет — до смерти Короля и конца войны. Цена была высока: она потеряла всю магию и свободу, но поверила, что эта жертва спасёт мир от ещё большего кровопролития."},"indent_text":"25px","show_if":[true,["hint_secret","=","done"]],"className":"hint","style":"","size_text":"12px","angle":"-0.96","font_family":"georgia","align":["center","start"]},{"go_to":"tue_no","position":[372,13],"size":[83,496],"art":"item_bookmark.png","name":{"en":"bookmark","ru":"закладка"},"indent_text":"25px","className":"hint","style":"","size_text":"12px","angle":0,"font_family":"georgia","align":["center","end"],"fit":"contain","color_text":"rgba(255,255,255,0)"},{"go_to":"tue_no","position":[108,61],"size":[220,150],"art":"item_hint.png","fit":"100% 100%","name":{"en":"The Diary of the Great Magician – part 1 For many years I wandered around the world and carried out my mission – to save a village from pestilence, protect crops from destruction, and the forest from fire. I've done a lot of good things for our kingdom. People praised me in all corners, because I used magic as my mentor toughed me – wisely and for the benefit of people.… But the war began... (The pages are torn off)","ru":"Дневник Великой Волшебницы – 1 часть Много лет бродила я по свету и выполняла поручения – спасти деревню от мора, урожай от гибели, а лес от пожара. Много успела я сделать добрых дел для нашего королевства. Славили меня люди во всех уголках, потому что использовала я магию как завещал мой наставник – мудро и на благо людей… Но началась война… (Страницы оборваны)"},"indent_text":"25px","show_if":[true,["hint_var","=","done"]],"className":"hint","style":"","size_text":"12px","angle":"0.45","font_family":"georgia","align":["center","end"]},{"go_to":"tue_no","position":[88,274],"size":[227,56],"art":"item_hint.png","fit":"100% 100%","name":{"en":"A hollow heart beneath the ground,         Where whispers crawl and fears are found. It cannot hear your prayer or cry —             But gold will make the darkness sigh.","ru":"Под землёй, где дышит сердце тьмы, Там едкий морок разгони.                      Оно не слышит плач и зов —                     Но злато - лучший из даров"},"indent_text":"25px","show_if":[true,["hint_witch","=","done"]],"className":"hint","style":"","size_text":"12px","angle":"-9.60","font_family":"georgia","align":["center","end"]},{"go_to":"tue_no","position":[87,356],"size":[243,103],"art":"item_hint.png","fit":"100% 100%","name":{"en":"Beneath the moss, a small one weeps,         For what he loved, the forest keeps.               He’d trade his shell, though cracked and cold, He’d trade his tears in crystal hold,                  For something warm, though barely bright — A gentle, fading inner light.                             Seek not the husk, nor frozen pain,                   But what still glows despite the rain.","ru":"Под мхом тихонько кто-то плачет,           Потерю лес хранит — не прячет.                 Он отдал бы и панцирь свой,                           И слезы, что застыли хрусталем                   За что-то тёплое, живое —                                За свет внутри, почти пустое.                                Не скорлупу ищи, не боль в стекле —               А то, что светится во тьме."},"indent_text":"25px","show_if":[true,["hint_cave","=","done"]],"className":"hint","style":"","size_text":"12px","angle":"4.06","font_family":"georgia","align":["center","end"]},{"go_to":"tue_no","position":[441,55],"size":[228,103],"art":"item_hint.png","fit":"100% 100%","name":{"en":"Beware the voice that calms the dying,         Whose smile is truth, yet built on lying.        He’ll promise peace, he’ll gift you rest —          And take the heartbeat from your chest.        Look not to blades nor watching eyes,             But where a silent darkness cries.                     A tear once shed, now cold and clear,             Holds every truth you fear to hear.","ru":"Берегись того, кто смертью усыпляет, Кто правдой лжёт и ложью утешает.      Он мир пообещает, сон подарит —         И пульс из сердца тихо забирает. Клинок отбрось, глазам не верь —  Поможет тебе лишь слеза камней. Слеза, что пала — холодна, чиста,            В ней вся та правда, что страшна всегда."},"indent_text":"25px","show_if":[true,["hint_forest","=","done"]],"className":"hint","style":"","size_text":"12px","angle":"-0.96","font_family":"georgia","align":["center","end"]}],"art":"bg_book.png","size":[800,600],"scroll":[0,0],"fit":"contain","background_music":"general music"}}],"Hut_on_the_edge_of_the_Forest":[{"dialogs":[{"text":{"en":"Through the dark, twisted forest, you could see the shape of a crooked, scary hut. The old, broken gate opened with a creak. Black branches grabbed at our clothes, and dark clouds hid the moonlight.","ru":"Сквозь темный искореженный лес стал виднеться силуэт покосившейся жуткой избы. Ветхая трухлявая калитка со скрипом распахнулась. Паутина черных веток цеплялась за одежду и свинцовые облака загораживали лунный свет."},"js":"","html":"","sound":{"en":"","ru":"wind"},"sound_stop":""},{"js":"","html":"","art":[{"position":["42.50%",0,"38.67%",0],"size":["5.12%","14.33%"],"url":"hero_witch_small.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","className":"small-witch","style":""}],"timer":[600,"tue_go"],"text":"...","sound":"wind"},{"text":{"en":"But I think there's a light on in the windows. I better go inside, because I'm getting goosebumps. And I'm… seeing things… brrr","ru":"Но, кажется в окнах горит свет.. Лучше зайти внутрь, а то тут мурашки бегут по коже. И мне.. что-то мерещится."},"js":"","html":"","name":"char0"}],"background_color":"#141921","background_image":"bg_witch_house.png","background_music":"general music"},{"dialogs":[{"art":[{"position":["0.75%",0,"42.33%",0],"size":["60.37%","58%"],"url":"main_character_back.png","fit":"contain","hotspot":["0%","0%"],"move":"0.7","speed":"ease-in-out"}],"timer":[700,"tue_go"],"sound":"steps"},{"art":[{"position":["27.13%",0,"43.50%",0],"size":["55.5%","45.67%"],"url":"main_charac make a mistake and trust the wrong person, you won't know the truth, and you won't get a firefly soul. Choose wisely and seek the truth to find out how to remove the curse.","ru":"Если доверишься - можешь получить нечто ценное - свет души. Но если ошибешься и доверишься не тому - и правды не узнаешь, и светлячка души не получишь. Выбирай с умом и ищи правду, чтобы узнать как снять проклятие"},"html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1"},{"text":{"en":"That's it, go now, I need to keep an eye on my soup, don't distract me. Socks are an important thing! Go look for the hut, there are answers there","ru":"Все, теперь ступай, мне надо за бульоном следить, не отвлекай. Носки – это дело важное. Иди ищи избушку, там есть ответы"},"html":"","art":[{"position":["30.50%",0,"5.67%",0],"size":["46.8%","58.51%"],"url":"hero_troll.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char1","choice":[{"go_to":"Hut_on_the_edge_of_the_Forest","position":["36.50%",0,0,"2.17%"],"size":["180px","4px"],"color":"rgba(242,242,242,0)","color_text":"#282f67","text":{"en":"Go look for a hut","ru":"Идти искать избушку"},"indent_text":"3%","art":"button_basic.png","sound":"button_click","hotspot":["0","0"],"size_text":"16px","art_size":"100% 100%","font_family":"gorgia"}]}],"background_color":"#141921","background_image":"bg_troll_path.png","background_music":"general music"}],"Dark_room":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"timer":[2500,"tue_go"],"controll":"hidden","sound_stop":{"en":["steps","general music"],"ru":"steps"},"sound":"creak 2"},{"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"sound":"screamer","sound_stop":"creak 2"},{"text":{"en":"Little traveler, have you come to my doorstep for answers? And if you don't like the truth? Well, you can ask two questions.","ru":"Маленький путник… Пришел за ответами на порог моего дома? А если тебе не понравится правда? Что ж, можешь задать два вопроса."},"js":"","html":"","name":"char2","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"go_to":"Now_answers"}]}],"Witch_answer_1":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"Didn't the Troll- weasel tell you about the soul-lights? You must collect three pure souls whose light has not yet faded. Once you have collected them, you must place them in the Great Tree, and only then the curse will be lifted and the forest will alive.","ru":"Тролль-проныра не рассказал тебе про огоньки душ? Ты должен собрать 3 чистых души, чей свет еще не угас. Собрав их, ты должен вложить их в Великое древо – только тогда проклятие спадет и лес оживет."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2","back_to":"Now_answers"}],"background_music":"general music"}],"Witch_answer_2":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"The Great Magician cursed the Forest for a reason. These creatures have offended her in some way – some of them unintentionally, while others have a devious plan. I cannot reveal more. If you listen to the stories of the creatures inhabiting the forest, you will be able to decide whether they are worthy of trust or oblivion. Be careful in your choice.","ru":"Великая Волшебница неспроста Лес прокляла. Существа эти обидели ее чем-то – кто-то не со зла, а кто-то коварный умысел затаил. Большего сказать я не могу… Если выслушаешь истории существ населяющих лес, сможешь решить – достойны они доверия или забвения. Смотри не ошибись при выборе… "},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2","back_to":"Now_answers"}],"background_music":"general music"}],"Now_answers":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"Hello... The Sock Troll said I could find clues here. Could I ask about...","ru":"Здравствуйте… Носочный Тролль сказал, что здесь я могу найти подсказки. Можно спросить о…"},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char0","choice":[{"go_to":"Witch_check","position":["34.88%",0,0,"2.67%"],"size":["224px","43px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"What about you?","ru":"А что насчет тебя?"},"indent_text":"8px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[],"show_if":[true,["question1","=","true"],["question2","=","true"]]},{"go_to":"Witch_answer_2","position":[0,"16.88%",0,"2.67%"],"size":["250px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Why is the Forest cursed?","ru":"Почему Лес проклят?"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["question2","set","true"]],"show_if":[false,["question1","=","true"],["question2","=","true"]]},{"go_to":"Witch_answer_1","position":["17.25%",0,0,"2.67%"],"size":["250px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"How to remove the curse?","ru":"Как снять проклятие?"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["question1","set","true"]],"show_if":[false,["question1","=","true"],["question2","=","true"]]}]}],"background_music":"general music"}],"Witch_check":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"The truth is in you","ru":"Истина в тебе. "},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2","choice":[{"go_to":"Witch_untrust","position":[0,"31.63%",0,"2.83%"],"size":["140px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Dont trust","ru":"Не доверять"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]},{"go_to":"Witch_trust","position":["30.75%",0,0,"2.84%"],"size":["140px","56px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Trust","ru":"Довериться"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[["secret_ending","add",1]]}]}],"background_music":"general music"}],"Witch_trust":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"Thank you for trusting me... That was the essence of my personal curse - despite my terrifying appearance, I needed to find someone who would trust me simply because they did, without fear or doubt.","ru":"Спасибо что доверился... Такова была суть моего личного проклятия - несмотря на жуткий облик, мне нужно было найти того, кто доверится мне просто так, без страха и сомнений.\n"},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2"},{"text":{"en":"I wasn't always a witch who lived on the edge of the forest, collecting other people's memories and weaving a lace of despair. I had no hope for the future before you came, but now I have a chance to make things right.","ru":"Не всегда я была ведьмой, что живет на краю леса, собирает чужие воспоминания и прядет кружево метаний... У меня не было надежды на будущее до твоего прихода.. но теперь есть шанс все исправить."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2"},{"text":{"en":"I only had the past... Once upon a time, my family was in danger, and I performed a ritual that granted me the gift of foresight, but I gave my heart in exchange. However, it was a dark and dishonest ritual, and as the centuries passed, I remained bound to the forest, unable to help anyone else.","ru":"У меня было только прошлое... Когда-то давно моя семья была в опасности, и я провела ритуал, получив дар предвиденья, но отдав свое сердце взамен. Но это был темный ритуал, нечестный. Прошли века, а я так и осталась привязана к лесу навеки, не в силах никому больше помочь."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2"},{"text":{"en":"If I said even one extra word, the black magic trapped in my body would feel it, and I would lose my soul, which is all that remains of me. So I can't give it to you either...","ru":"Если я сказала бы хоть одно лишнее слово, черная магия, запертая в моем теле, почувствовала бы это и я бы потеряла свою душу - единственное, что от меня осталось. Так что и тебе я ее не могу отдать..."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2","go_to":"Give_a_map"}],"background_music":"general music"}],"Witch_untrust":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"Well, I understand you, Little Spirit. May good fortune accompany you on your journey. You will have to make very important choices that will determine the fate of the Forgotten Forest. Perhaps you will succeed, and it will once again be known as the Magical Forest.","ru":"Что ж, я понимаю тебя. Маленький Дух. Пусть же удача сопутствует тебе в дороге. Тебе предстоит сделать очень важные выборы, от которых зависит судьба всего Забытого Леса. Возможно ты преуспеешь и он вновь станет по праву называться Магическим."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2","go_to":"Give_a_map"}],"background_music":"general music"}],"Give_a_map":[{"background_image":"bg_dark_witch_room.png","dialogs":[{"text":{"en":"But I can give you a map that will lead you to the Great Tree. You must collect three pure souls to invoke His will, to gain power, and to lift the curse.","ru":"Но могу дать тебе карту, которая укажет путь к Великому Древу. Три чистых души должен ты собрать, чтобы воззвать к Его воле. напитать силой и снять проклятие."},"js":"","html":"","art":[{"position":["20.50%",0,"-1.50%",0],"size":["60.5%","101.67%"],"url":"hero_witch_without_a_heart.png","fit":"contain","hotspot":["0%","0%"]}],"name":"char2"}],"background_music":"general music"},{"background_image":"bg_light_witch_room.png","dialogs":[{"text":{"en":"The witch suddenly disappears, dissolving into a black haze. The candles and fireplace in the room flare up, and you see that she has left behind a gold coin. Did she drop it on purpose?","ru":"Ведьма внезапно исчезает, растворившись черной дымкой. Свечи и камин в комнате вспыхивают и ты видишь, что она оставила после себя золотую монетку. Специально обронила?"},"go_to":"Appearing_slots","choice":[{"go_to":"tue_no","position":["35.06%",0,0,"37.17%"],"size":["30.49px","4.16px"],"color":"rgba(242,242,242,0)","color ,"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char0"}],"background_music":"general music"},{"background_image":"bg_cave2.png","dialogs":[{"text":{"en":"Ah, the Magician... Yes, I knew her. She was funny, and she thought she could control the Darkness. I tried to help her, but she couldn't handle her powers and was consumed by the Darkness herself. She wanted power, and she dreamed of overthrowing the King. I gave in to her foolish ideas, and now I regret it. She was weak, and she couldn't handle such power.\n","ru":"Ах Волшебница… Да, я знал ее. Смешная, думала, что может управлять Тьмой. Я пытался ей помочь, но она не совладала с силами и сама была поглощена тьмой. Она хотела власти, мечтала свергнуть короля. Я поддался ее глупым идеям и теперь жалею. Она была слаба и не смогла совладать с такой силой."},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char3"},{"text":{"en":"The only thing she told me to say to all the travelers who visit me is, \"There is no future without the past.\" I am obligated to say this because I have made a vow, but I am not obligated to explain it.\n","ru":"Единственное, что она завещала мне говорить всем путникам, которые навестят меня  - «Без прошлого нет будущего». Я обязан это говорить, так как дал обет, но расшифровывать не обязан.\n"},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char3","go_to":"Cave_check"}],"background_music":"general music"}],"Cave_check":[{"background_image":"bg_cave2.png","dialogs":[{"text":{"en":"Well, he won't say another word until I make a decision...","ru":"Что ж, больше он не скажет ни слова, пока не приму решение.."},"choice":[{"go_to":"Keeper_trust","position":["30.75%",0,0,"2.84%"],"size":["140px","56px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Trust","ru":"Довериться"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text":"16px","font_family":"georgia","className":"","variables":[]},{"go_to":"Keeper_untrust","position":[0,"31.63%",0,"2.83%"],"size":["140px","55px"],"color":"rgba(242,242,242,0)","color_text":"#141921","text":{"en":"Dont trust","ru":"Не доверять"},"indent_text":"2px","style":"","art":"button_basic.png","sound":"button_click","hotspot":["0%","0%"],"art_size":"100% 100%","size_text": size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char3","go_to":"Cave_of_knowledge"}],"background_music":"general music"}],"Keeper_untrust":[{"background_image":"bg_cave2.png","dialogs":[{"text":{"en":"You don't believe me, but what could I do? The forest was weak and decrepit, and I was only trying to renew it, to cleanse it of its rot. They can blame me if they want, but I was the one who gave the forest the breath of the night. I serve only the Darkness, and it is the Darkness that purifies this forest, making it perfect, clean, and filled with eternal peace.\n","ru":"Не веришь мне значит.. Но что я мог сделать? Лес был слаб, дряхл. Я лишь помог обновить его — очистить от гнили. Пусть винят меня, если хотят, но именно я дал лесу дыхание ночи. Я служу одной лишь Тьме и она очищает этот лес, делает идеальным – чистым и полным вечного покоя."},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char3"},{"text":{"en":"Why.. Are you happy about the curse?\n","ru":"Почему.. ты рад проклятию?"},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char0"},{"text":{"en":"The stronger the curse, the stronger the Darkness, and myself. So I spend all my time here strengthening the curse of the forest and worshipping my Patroness. Once upon a time, the Lake rejected me, even though I was the best student. Then I found another way – the Darkness gave me its power and I've been worshipping it ever since.\n","ru":"Чем сильнее проклятие, тем сильнее Тьма и я сам. Так что я провожу все свое время тут, усиливая проклятие леса и поклоняясь моей Покровительнице. Когда-то давно Озеро отвергло меня, хотя я был лучшим учеником. Тогда я нашел другой путь – Тьма дала мне свою силу и с тех пор я поклоняюсь ей."},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char3"},{"text":{"en":"But.. What happened to the Magician then?\n","ru":"Но.. что тогда случилось с Волшебницей?"},"choice":[{"go_to":"tue_no","position":[0,"1.52%",0,"26.83%"],"size":["51.33px","28.33px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"scroll cave","ru":"свиток в пещере"},"indent_text":"8px","art":"item_scroll_cave.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"","style":"","variables":[],"show_if":[false,["item_show","=",1]]},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"name":"char0"},{"text":{"en":"Just like I said. She was weak and unworthy. I was just using her. She needed a lot of magic to create a spell, and she begged crumbs from everyone in this forest. I gave her my power.. It's not my fault that she didn't see the Darkness in it. When she began to weave her spell, the Darkness broke out, transformed the spell into a curse, and she herself was scattered into the shadows. Glory to the Darkness! When the Forest is completely transformed, I will become the most powerful being in the world.","ru":"Как я и говорил. Она была слаба и недостойна. Я просто использовал ее. Ей нужно был много магии для создания заклятья, и она просила крохи у всех в этом лесу. Я и дал ей свою силу.. Не моя вина, что она не разглядела Тьмы. Когда она начала плести свое заклятье, Тьма вырвалась, трансформировала заклинание в проклятье, а ее саму развеяло в тенях. Слава Тьме! Когда Лес полностью преобразится, я стану самым могущественным существом в мире."},"ch ian  came and asked me for magic. But I couldn't give her even a grain - magic was needed for my children. I turned her down and she left. The next time I left the meadow, when I returned, I found that my children and all the collected dewdrops with magic were gone.\n\n","ru":"Когда-то у меня была семья. Малютки, которых я выкармливал, бережно собирая для них свет в росинки. Точно такие амулеты я и создавал. Но потом пришла Волшебница и попросила у меня магию. Но я не мог ей отдать даже крупицу - она нужна была для моих детей. Я отказал ей и она ушла. Когда я в следующий раз отлучился с полянки, вернувшись, я обнаружил, что мои дети и все собранные росинки с магией пропали."},"name":"char3_copu","choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["24.13%",0,"22.50%",0],"size":["49.62%","54.5%"],"url":"hero_snail_cat.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1"}]},{"text":{"en":"I don't know what happened to them.. I don't believe the Magician took them.. Soon, a curse descended on the Forest and I completely stopped feeling them. Maybe the Forest took their souls while trying to resist the curse.. I don't know.. Maybe when the curse is lifted, the Forest will give me back my babies.. I really hope they're still okay..\n\n","ru":"Я не знаю что с ними случилось.. Я не верю, что Волшебница забрала их.. Вскоре на Лес опустилось проклятие и я совсем перестал их чувствовать. Может, Лес забрал их души пока пытался противостоять проклятию.. Я не знаю.. Возможно, когда проклятие рассеется, Лес вернет мне моих малышей.. Я так надеюсь, что с ними все еще хорошо.."},"name":"char3_copu","choice":[{"go_to" st. You can never have too much power, can you?","ru":"Посмотри на меня, видишь, как я полон сил и магии. Весь этот белесый туман вокруг - моих рук дело. Я могу и тебе дать эту силу. Возможно с ней тебе все таки удастся снять проклятие с Леса. Силы много не бывает, ведь так?"},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["42.24%",0,0,"29.47%"],"size":["10.01%","13.37%"],"url":"main_character_small.png","fit":"contain","hotspot":["0%","0%"],"move":"1","speed":"ease-in-out"},{"position":[0,"8.38%","9.32%",0],"size":["36.3%","55.68%"],"url":"hero_moon_face.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"2.5"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]}],"name":"char3_copu_copu"},{"text":{"en":"Good.. If it helps me, I'll give it a try. What should I do?","ru":"Хорошо.. Если это мне поможет, то можно и попробовать.. Что мне нужно сделать?"},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["42.24%",0,0,"29.47%"],"size":["10.01%","13.37%"],"url":"main_character_small.png","fit":"contain","hotspot":["0%","0%"],"move":"1","speed":"ease-in-out"},{"position":[0,"8.38%","9.32%",0],"size":["36.3%","5 tual went wrong - the Magician expected that she would have to pay only with her magic, but she had to pay with her life. I stole her life force and I'm still spinning it for myself - it was a strong soul, pure.","ru":"Душа Волшебницы была так огромна, а свет ее так ярок, что я захотел заполучить ее. Так, ритуал прошел неправильно - Волшебница рассчитывала, что придется заплатить только своей магией, а пришлось заплатить жизнью. Я украл ее жизненную силу и до сих пор пряду из нее годы жизни себе - сильная была душа, чистая."},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["42.24%",0,0,"29.47%"],"size":["10.01%","13.37%"],"url":"main_character_small.png","fit":"contain","hotspot":["0%","0%"],"move":"1","speed":"ease-in-out"},{"position":[0,"8.38%","9.32%",0],"size":["36.3%","55.68%"],"url":"hero_moon_face.png","fit":"contain","hotspot":["0%","0%"],"opacity":"1","move":"2.5"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]}],"name":"char3_copu_copu"},{"text":{"en":"But what exactly did the Great Magician want to do? Why such a big sacrifice? After all, a magician hardly lives without magic.","ru":"Но что именно хотела сделать Волшебница? К чему такая большая жертва? Ведь маг без магии почти что не и не живет."},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art t":"contain","hotspot":["0%","0%"],"move":"1"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]],"className":"soul1"},{"position":[0,"33.63%",0,"20.67%"],"size":["6.37%","10.67%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"0","className":""}],"name":"char3_copu_copu_copu"},{"text":{"en":"We raised her with love, I taught her magical knowledge and spells, the Tree generously indulged her with rare spells, the Lake generously shared magic, and the inhabitants of the Forest taught her moral guidelines. Therefore, when I let her go to serve in the Kingdom, I was not worried - she was always an honest, kind and incredibly fair child. Maybe that's why they were able to deceive her.…","ru":"Мы растили ее с любовью, я учил ее магическим знаниям и заклинаниям, Древо щедро баловало ее редкими заклинаниями, Озеро щедро поделилось магией, а жители леса научили ее моральным ориентирам. Поэтому когда я отпускал ее на службу в Королевство я не переживал - она всегда была честным, добрым и невероятно справедливым ребенком. Может поэтому ее и смогли обмануть…"},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["40.88%",0,"-5.00%",0],"size":["56.12%","110.67%"],"url":"hero_old_sage.png","fit":"contain","hotspot":["0%","0%"],"move":"1"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]],"className":"soul1"},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":""}],"name":"char3_copu_copu_copu","sound":"magic appearance"},{"text":{"en":"Something happened to her when she came to me the second time. Her soul stood on the edge between light and darkness, and dark magic swirled in her heart. She asked me for magic power, but I refused - I was just afraid that she wouldn't be able to stand it, her soul was like a cracked vessel, the power could break her. So I sent her to the Lake so that the Spirit of the Lake could look into her soul and make a decision.","ru":"Что-то случилось с ней, когда она пришла ко мне во второй раз. Ее душа стояла на грани между светом и тьмой, а в сердце клубилась темная магия. Она просила у меня силы, но я отказал - я просто боялся что она не выдержит, ее душа и так была как надтреснутый сосуд. Поэтому я отправил ее к Озеру, чтобы Дух Озера заглянул в ее глубины и принял решение."},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"}],"art":[{"position":["40.88%",0,"-5.00%",0],"size":["56.12%","110.67%"],"url":"hero_old_sage.png","fit":"contain","hotspot":["0%","0%"],"move":"1"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":""}],"name":"char3_copu_copu_copu"},{"text":{"en":"She probably felt that I had betrayed her. She left without a word. But I did not betray.. I was just afraid for her. I still have her first magic storage ring. I miss her so much.. But stop reopening old wounds. Take this ring and give it to the spirit of the Lake. This gift should be liked by the Spirit. Perhaps this way the Lake will be more willing to reveal its secrets to you.","ru":"Наверное, она посчитала, что я предал ее. Она молча ушла. Но я не предавал.. Просто боялся за нее. Я все еще храню у себя ее первое кольцо-накопитель магии. Как же я скучаю по ней.. Но хватит бередить старые раны. Возьми это кольцо и отдай его духу Озера. Этот подарок должен прийтись по душе. Возможно так озеро охотнее раскроет тебе свои тайны."},"choice":[{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["45px","50px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"slot","ru":"слот"},"indent_text":"8px","art":"ui_slot.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"slot","style":".slot{\n  pointer-events: none; /* делает элемент полностью некликабельным */\n}"},{"go_to":"tue_no","position":["2.50%",0,"13.00%",0],"size":["46.99px","49px"],"color":"rgba(242,242,242,0)","color_text":"rgba(20,25,33,0)","text":{"en":"ring","ru":"кольцо"},"indent_text":"8px","art":"item_heart_stone.png","sound":{"en":"","ru":""},"hotspot":["0%","0%"],"art_size":"contain","className":"ring","style":""}],"art":[{"position":["40.88%",0,"-5.00%",0],"size":["56.12%","110.67%"],"url":"hero_old_sage.png","fit":"contain","hotspot":["0%","0%"],"move":"1"},{"position":["11.50%",0,"2.17%",0],"size":["4.37%","7.83%"],"url":"ui_soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","show_if":[true,["soul_light","=",1]]},{"position":["15.50%",0,"2.33%",0],"size":["4.37%","7.17%"],"url":"soul_light.png","fit":"contain","hotspot":["0%","0%"],"move":"1","className":""}],"name":"char3_copu_copu_copu","sound":"take_scroll4"},{"text":{"en":"Go to the Lake of Souls, the Spirit will meet you there. Take your time to make a decision - look into the black waters
